name: Release

on:
    workflow_dispatch:

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    publish:
        name: publish to npm
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - run: npm ci

            # The tag that triggered the release decides the published version ("0.2.0" or "v0.2.0"),
            # so package.json never has to be bumped by hand before tagging.
            - name: Set the package version from the tag
              env:
                  REF_TYPE: ${{ github.ref_type }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  if [ "$REF_TYPE" != "tag" ]; then
                      echo "::error::Run the Release workflow on a tag (e.g. 0.2.0), not on the branch $REF_NAME."
                      exit 1
                  fi
                  version="${REF_NAME#v}"
                  npm version "$version" --no-git-tag-version --allow-same-version
                  echo "Publishing version $(node -p 'require("./package.json").version')"

            - run: npm run typecheck

            - run: npm run lint

            - run: npm run test

            - run: node scripts/smoke_test_package.mjs

            # prepack rebuilds dist from this same commit, the one the smoke test just checked.
            - run: npm publish --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
